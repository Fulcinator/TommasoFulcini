name: Sync Service From Researchr

on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Update service data
        run: node scripts/sync-service-from-researchr.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/sync-service-from-researchr.mjs
            git add service-data.json

            if git diff --cached --quiet; then
              echo "No service changes detected."
              exit 0
            fi

            git commit -m "Sync service from researchr"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rejected on attempt $attempt. Retrying on top of latest main..."
          done

          echo "Failed to push service update after 3 attempts."
          exit 1
