name: Sync News From Issue

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
      - unlabeled
      - closed
  workflow_dispatch:
  schedule:
    - cron: "11 5 * * 1"

permissions:
  contents: write
  issues: read

jobs:
  sync-news:
    if: >
      github.event_name != 'issues' ||
      (
      github.event.issue.pull_request == null &&
      (
        contains(join(github.event.issue.labels.*.name, ','), 'news') ||
        (github.event.action == 'labeled' && github.event.label.name == 'news') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'news')
      )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Update news data
        run: node scripts/sync-news-from-issue.mjs
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/sync-news-from-issue.mjs
            git add news-data.js

            if git diff --cached --quiet; then
              echo "No news changes detected."
              exit 0
            fi

            if [ "${{ github.event_name }}" = "issues" ]; then
              git commit -m "Sync news from issue #${{ github.event.issue.number }}"
            else
              git commit -m "Rebuild news from issues"
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rejected on attempt $attempt. Retrying on top of latest main..."
          done

          echo "Failed to push news update after 3 attempts."
          exit 1
