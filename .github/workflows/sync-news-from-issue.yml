name: Sync News From Issue

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled

permissions:
  contents: write
  issues: read

jobs:
  sync-news:
    if: >
      github.event.issue.pull_request == null &&
      contains(join(github.event.issue.labels.*.name, ','), 'news') &&
      (github.event.action != 'labeled' || github.event.label.name == 'news')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update news data
        run: node scripts/sync-news-from-issue.mjs
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.js
          if git diff --cached --quiet; then
            echo "No news changes detected."
            exit 0
          fi
          git commit -m "Sync news from issue #${{ github.event.issue.number }}"
          git push
